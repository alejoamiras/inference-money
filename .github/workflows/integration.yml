name: Integration

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/integration/**'
              - 'packages/bridge-core/**'
              - 'packages/deployer/**'
              - 'packages/demo/**'
              - 'packages/local-network/**'
              - 'toolchain.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'biome.json'
              - 'tsconfig.base.json'
              - '.github/workflows/integration.yml'
              - '.github/actions/setup-toolchains/**'
      - if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  # The specs need the pinned Aztec node, so they run in the local phase gate; CI keeps them compiling.
  integration:
    name: lint, typecheck
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchains
      - run: bunx biome ci packages/integration
      - run: bun run --cwd packages/integration typecheck

  status:
    name: integration-status
    if: always()
    needs: [changes, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped suite is green only when the filter said it was irrelevant; anything else fails.
      - env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          SUITE: ${{ needs.integration.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "::error::change detection: $CHANGES"; exit 1; }
          if [ "$RELEVANT" = true ]; then
            [ "$SUITE" = success ] || { echo "::error::integration ended $SUITE"; exit 1; }
          else
            case "$SUITE" in success|skipped) ;; *) echo "::error::integration ended $SUITE"; exit 1 ;; esac
          fi
