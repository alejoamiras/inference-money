name: Web

on:
  workflow_dispatch:
  pull_request:
    # `labeled`: adding the `e2e` label runs the browser suite without a new push.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: web-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The app bundles bridge-core and embeds the committed testnet manifest.
          filters: |
            relevant:
              - 'apps/web/**'
              - 'packages/bridge-core/**'
              - 'contracts/aztec/*/target/**'
              - 'deployments/testnet.json'
              - 'toolchain.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'biome.json'
              - 'tsconfig.base.json'
              - '.github/workflows/web.yml'
              - '.github/workflows/_e2e.yml'
              - 'packages/local-network/**'
              - 'packages/deployer/**'
              - '.github/actions/setup-toolchains/**'
      - if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  web:
    name: lint, typecheck, components, build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchains
      - run: bunx biome ci apps/web
      - run: bun run --cwd apps/web typecheck
      - run: bun run --cwd apps/web test:components
      # The shipped artifact: the committed testnet manifest and nothing else, with its generated _headers.
      - run: bun run --cwd apps/web build:testnet
      - run: test -s apps/web/dist/_headers

  # The browser suite runs only on request, and then whatever the PR touches: it deploys the contracts too, so no
  # path filter could say it is irrelevant.
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/_e2e.yml

  status:
    name: web-status
    if: always()
    needs: [changes, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped suite is green only when the filter said it was irrelevant; anything else fails.
      - env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          WEB: ${{ needs.web.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_REQUESTED: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          [ "$CHANGES" = success ] || { echo "::error::change detection: $CHANGES"; exit 1; }
          if [ "$RELEVANT" = true ]; then
            [ "$WEB" = success ] || { echo "::error::web ended $WEB"; exit 1; }
          else
            case "$WEB" in success|skipped) ;; *) echo "::error::web ended $WEB"; exit 1 ;; esac
          fi
          # Requested, e2e must pass; unrequested, it must not have run.
          if [ "$E2E_REQUESTED" = true ]; then
            [ "$E2E" = success ] || { echo "::error::e2e was requested and ended $E2E"; exit 1; }
          else
            [ "$E2E" = skipped ] || { echo "::error::e2e ended $E2E"; exit 1; }
          fi
