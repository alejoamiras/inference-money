name: Bridge core

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: bridge-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The ABI pins read the forge build, and the class-id pins read the committed L2 artifacts.
          filters: |
            relevant:
              - 'packages/bridge-core/**'
              - 'contracts/evm/**'
              - 'contracts/aztec/*/target/**'
              - 'toolchain.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'test-preload.ts'
              - 'biome.json'
              - 'tsconfig.base.json'
              - '.github/workflows/bridge-core.yml'
              - '.github/actions/setup-toolchains/**'
      - if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  bridge-core:
    name: lint, typecheck, unit
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchains
        with:
          foundry: "true"
      - run: bunx biome ci packages/bridge-core
      - run: bun run --cwd packages/bridge-core typecheck
      # Builds contracts/evm first, so the ABI pins always compare against fresh forge output.
      - run: bun run --cwd packages/bridge-core test

  status:
    name: bridge-core-status
    if: always()
    needs: [changes, bridge-core]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped suite is green only when the filter said it was irrelevant; anything else fails.
      - env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CORE: ${{ needs.bridge-core.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "::error::change detection: $CHANGES"; exit 1; }
          if [ "$RELEVANT" = true ]; then
            [ "$CORE" = success ] || { echo "::error::bridge-core ended $CORE"; exit 1; }
          else
            case "$CORE" in success|skipped) ;; *) echo "::error::bridge-core ended $CORE"; exit 1 ;; esac
          fi
