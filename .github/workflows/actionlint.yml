name: Lint workflows

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: actionlint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.override.outputs.relevant || steps.filter.outputs.workflows }}
      shell: ${{ steps.override.outputs.relevant || steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            shell:
              - '**/*.sh'
      - if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e # v1.74.0
        with:
          fail_on_error: true

  shellcheck:
    name: Shellcheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

  status:
    name: actionlint-status
    if: always()
    needs: [changes, actionlint, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped suite is green only when the filter said it was irrelevant; anything else fails.
      - env:
          CHANGES: ${{ needs.changes.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "::error::change detection: $CHANGES"; exit 1; }
          for r in "$ACTIONLINT" "$SHELLCHECK"; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job ended $r"; exit 1 ;; esac
          done
