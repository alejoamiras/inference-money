[install]
# Blocks packages published in the last 7 days: npm token-compromise worms are usually pulled within hours.
# CVE bypass: add `minimumReleaseAgeExcludes = ["<name>"]`, install the patched version, remove the entry in the same PR.
minimumReleaseAge = 604800
# Per-workspace symlinked node_modules: a workspace resolves only what it declares.
linker = "isolated"
# Aztec 6.0.0-rc.1 (D27): excluded by name, since bun has no scope wildcard. Every entry clears the gate on
# 2026-09-30T20:10Z; drop the list once the lockfile no longer needs it.
minimumReleaseAgeExcludes = [
	"@aztec-foundation/aztec-standards",
	"@aztec-foundation/bb-avm-sim",
	"@aztec-foundation/bb-avm-sim-darwin-arm64",
	"@aztec-foundation/bb-avm-sim-darwin-x64",
	"@aztec-foundation/bb-avm-sim-linux-arm64",
	"@aztec-foundation/bb-avm-sim-linux-x64",
	"@aztec-foundation/bb.js",
	"@aztec-foundation/cdb",
	"@aztec-foundation/ipc-runtime",
	"@aztec-foundation/l1-artifacts",
	"@aztec-foundation/noir-acvm_js",
	"@aztec-foundation/noir-noir_codegen",
	"@aztec-foundation/noir-noirc_abi",
	"@aztec-foundation/noir-types",
	"@aztec-foundation/wsdb",
	"@aztec-foundation/wsdb-darwin-arm64",
	"@aztec-foundation/wsdb-darwin-x64",
	"@aztec-foundation/wsdb-linux-arm64",
	"@aztec-foundation/wsdb-linux-x64",
	"@aztec-labs/accounts",
	"@aztec-labs/aztec.js",
